# Production deployment — run with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required: create a .env.production file first (see .env.production.example)

services:
  postgres:
    image: postgres:16-alpine
    container_name: etax-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      POSTGRES_DB: ${DB_NAME:-etax_filing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host — only reachable by other containers

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.compose
    container_name: etax-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      DB_NAME: ${DB_NAME:-etax_filing}

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.compose
      args:
        VITE_API_BASE_URL: /api
    container_name: etax-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HOST_PORT:-80}:80"

volumes:
  pgdata:

